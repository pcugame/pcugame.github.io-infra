release: responsive-images
policy: web-before-api
immutable: true
reason: >-
  This release replaces the public image URL contract with ResponsiveImage and
  removes the legacy public-image redirect routes. The matching Web build must
  be live before the API begins serving the new response shape.
rollout:
  - Back up PostgreSQL before changing the production schema.
  - Deploy and verify the Web build for this exact release commit.
  - Verify image_renditions is empty before applying the responsive-image migration set.
  - If image_renditions is non-empty, abort the rollout and reconcile its durable object inventory.
  - Drain the old API, apply the migration set, and deploy the API build for the same commit.
  - Verify the follow-up migration dropped the unused image_renditions table and ImageRenditionProfile type.
  - Run smoke tests, then perform a small image-rendition backfill before the full backfill.
notes: >-
  A short Web/old-API contract mismatch is accepted during rollout. Recovery
  keeps the existing deployment and runbook flow; operators may redeploy the
  same SHA pair. This declaration does not add an API-before-Web gate.
