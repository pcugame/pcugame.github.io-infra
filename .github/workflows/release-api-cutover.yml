name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Production release operation'
        required: true
        type: choice
        default: release
        options: [release, snapshot, forward-fix]
      final_api_image:
        description: 'Immutable @sha256 API/worker image (required for forward fix)'
        required: false
        type: string
      forward_fix_acknowledgement:
        description: 'Required acknowledgement for forward fix (see release runbook)'
        required: false
        type: string

concurrency:
  group: production-object-cutover
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      final_image: ${{ steps.release.outputs.final_image }}
    steps:
      - name: Fail closed outside the production control default branch
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ "${GITHUB_REPOSITORY}" = pcugame/pcugame.github.io-infra ]
          [ "${GITHUB_DEFAULT_BRANCH}" = master ]
          [ "${GITHUB_REF}" = refs/heads/master ]

      - uses: actions/checkout@v4

      - name: Verify production control repository and default branch
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node server/verify-release-source.mjs

      - id: release
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          FINAL_IMAGE: ${{ inputs.final_api_image }}
          FORWARD_FIX_ACKNOWLEDGEMENT: ${{ inputs.forward_fix_acknowledgement }}
        run: bash server/release-inputs.sh

  snapshot:
    if: ${{ inputs.operation == 'snapshot' }}
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify snapshot control branch
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node server/verify-release-source.mjs
      - name: Copy reviewed snapshot control
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: server/release-db-snapshot.sh
          target: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          strip_components: 1
          overwrite: true
      - name: Snapshot DB and verify isolated restore
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_DIR,RELEASE_SOURCE_SHA
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export PATH="$PATH:/usr/local/bin:/usr/bin"
            bash "${DEPLOY_DIR}/release-db-snapshot.sh" "${RELEASE_SOURCE_SHA}"

  resolve_image:
    if: ${{ inputs.operation == 'release' }}
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node server/resolve-release-image.mjs

  build_image:
    if: ${{ inputs.operation == 'release' && needs.resolve_image.outputs.image == '' }}
    needs: [authorize, resolve_image]
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit

  cutover:
    if: ${{ always() && needs.authorize.result == 'success' && inputs.operation != 'snapshot' && (inputs.operation != 'release' || (needs.resolve_image.result == 'success' && (needs.resolve_image.outputs.image != '' || needs.build_image.result == 'success'))) }}
    needs: [authorize, resolve_image, build_image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fail closed outside the production control default branch
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ "${GITHUB_REPOSITORY}" = pcugame/pcugame.github.io-infra ]
          [ "${GITHUB_DEFAULT_BRANCH}" = master ]
          [ "${GITHUB_REF}" = refs/heads/master ]

      - uses: actions/checkout@v4

      - name: Re-verify production control repository and default branch
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node server/verify-release-source.mjs

      - name: Preflight external Pages target and write access before maintenance
        if: ${{ inputs.operation == 'release' }}
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: node server/verify-github-release-boundaries.mjs pages

      - name: Copy release controls to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: server/deploy.sh,server/deploy,server/quadlet,server/smoke-data-plane.mjs,server/release-db-snapshot.sh,server/release-recovery.mjs,server/release-smoke-target.mjs,server/ip-ban-audit.sh,server/release-orchestrate.sh
          target: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          strip_components: 1
          overwrite: true

      - name: Set up Node for final web
        if: ${{ inputs.operation == 'release' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install final web dependencies
        if: ${{ inputs.operation == 'release' }}
        run: npm ci --workspace=apps/web --include-workspace-root

      - name: Test final web
        if: ${{ inputs.operation == 'release' }}
        working-directory: apps/web
        run: npm test

      - name: Lint final web
        if: ${{ inputs.operation == 'release' }}
        working-directory: apps/web
        run: npm run lint

      - name: Build final web
        if: ${{ inputs.operation == 'release' }}
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
          VITE_VISIBILITY_CONTROLS_ENABLED: ${{ vars.VITE_VISIBILITY_CONTROLS_ENABLED || 'false' }}
        run: npm run build

      - name: Stamp exact release commit
        if: ${{ inputs.operation == 'release' }}
        working-directory: apps/web
        run: printf '%s\n' "${GITHUB_SHA}" > dist/release-sha.txt

      - name: Capture Pages recovery point
        id: capture-pages
        if: ${{ inputs.operation == 'release' }}
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          RECOVERY_DIR: ${{ runner.temp }}/pages-release-recovery
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node server/pages-release-recovery.mjs capture "$RECOVERY_DIR" "$GITHUB_SHA" "$RELEASE_RUN_KEY"

      - name: Preflight verified release
        if: ${{ inputs.operation == 'release' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          FINAL_IMAGE: ${{ needs.resolve_image.outputs.image || needs.build_image.outputs.image || needs.authorize.outputs.final_image }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          SMOKE_PUBLIC_OBJECT_URL: ${{ secrets.SMOKE_PUBLIC_OBJECT_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,FINAL_IMAGE,RELEASE_SOURCE_SHA,RELEASE_RUN_KEY,SMOKE_PUBLIC_OBJECT_URL
          command_timeout: 60m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" preflight

      - name: Back up and drain production
        if: ${{ inputs.operation == 'release' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          FINAL_IMAGE: ${{ needs.resolve_image.outputs.image || needs.build_image.outputs.image || needs.authorize.outputs.final_image }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          SMOKE_PUBLIC_OBJECT_URL: ${{ secrets.SMOKE_PUBLIC_OBJECT_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,FINAL_IMAGE,RELEASE_SOURCE_SHA,RELEASE_RUN_KEY,SMOKE_PUBLIC_OBJECT_URL
          command_timeout: 60m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" backup

      - name: Apply release migrations
        id: migrate
        if: ${{ inputs.operation == 'release' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          FINAL_IMAGE: ${{ needs.resolve_image.outputs.image || needs.build_image.outputs.image || needs.authorize.outputs.final_image }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          SMOKE_PUBLIC_OBJECT_URL: ${{ secrets.SMOKE_PUBLIC_OBJECT_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,FINAL_IMAGE,RELEASE_SOURCE_SHA,RELEASE_RUN_KEY,SMOKE_PUBLIC_OBJECT_URL
          command_timeout: 60m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" migrate

      - name: Activate API and workers
        if: ${{ inputs.operation == 'release' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          FINAL_IMAGE: ${{ needs.resolve_image.outputs.image || needs.build_image.outputs.image || needs.authorize.outputs.final_image }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          SMOKE_PUBLIC_OBJECT_URL: ${{ secrets.SMOKE_PUBLIC_OBJECT_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,FINAL_IMAGE,RELEASE_SOURCE_SHA,RELEASE_RUN_KEY,SMOKE_PUBLIC_OBJECT_URL
          command_timeout: 60m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" activate

      - name: Verify complete runtime health
        if: ${{ inputs.operation == 'release' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          FINAL_IMAGE: ${{ needs.resolve_image.outputs.image || needs.build_image.outputs.image || needs.authorize.outputs.final_image }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          SMOKE_PUBLIC_OBJECT_URL: ${{ secrets.SMOKE_PUBLIC_OBJECT_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,FINAL_IMAGE,RELEASE_SOURCE_SHA,RELEASE_RUN_KEY,SMOKE_PUBLIC_OBJECT_URL
          command_timeout: 60m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" health

      - name: Verify external Pages repository write access
        if: ${{ inputs.operation == 'release' }}
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: node server/verify-github-release-boundaries.mjs pages

      - name: Publish exact release web after runtime health
        if: ${{ inputs.operation == 'release' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: pcugame/pcugame.github.io
          publish_branch: master
          publish_dir: apps/web/dist
          full_commit_message: Deploy ${{ github.sha }} (run ${{ github.run_id }}-${{ github.run_attempt }})
          user_name: bipolarrr
          user_email: challengedbipolar@gmail.com

      - name: Run final release smoke and record evidence
        if: ${{ inputs.operation == 'release' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          FINAL_IMAGE: ${{ needs.resolve_image.outputs.image || needs.build_image.outputs.image || needs.authorize.outputs.final_image }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          SMOKE_PUBLIC_OBJECT_URL: ${{ secrets.SMOKE_PUBLIC_OBJECT_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,FINAL_IMAGE,RELEASE_SOURCE_SHA,RELEASE_RUN_KEY,SMOKE_PUBLIC_OBJECT_URL
          command_timeout: 60m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" smoke

      - name: Run forward fix
        if: ${{ inputs.operation == 'forward-fix' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          FINAL_IMAGE: ${{ needs.resolve_image.outputs.image || needs.build_image.outputs.image || needs.authorize.outputs.final_image }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          SMOKE_PUBLIC_OBJECT_URL: ${{ secrets.SMOKE_PUBLIC_OBJECT_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,FINAL_IMAGE,RELEASE_SOURCE_SHA,RELEASE_RUN_KEY,SMOKE_PUBLIC_OBJECT_URL
          command_timeout: 60m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" forward-fix

      - name: Restore Pages before pre-migration recovery
        id: restore-pages
        if: ${{ failure() && steps.capture-pages.outcome == 'success' && steps.migrate.outcome == 'skipped' }}
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          RECOVERY_DIR: ${{ runner.temp }}/pages-release-recovery
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node server/pages-release-recovery.mjs restore "$RECOVERY_DIR" "$GITHUB_SHA" "$RELEASE_RUN_KEY"

      - name: Recover original runtime only before migration attempt
        if: ${{ failure() && steps.restore-pages.outcome == 'success' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          RELEASE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          WEB_RECOVERY_VERIFIED: 'true'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_DIR,RELEASE_RUN_KEY,WEB_RECOVERY_VERIFIED
          script_stop: true
          command_timeout: 10m
          script: bash "${DEPLOY_DIR}/release-orchestrate.sh" recover
