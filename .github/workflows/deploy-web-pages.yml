name: Deploy Web to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web-pages.yml'
      - '.github/release-gates/web-before-api/**'
      - '.github/release-gates/cutover-maintenance/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce API and workers before breaking-cutover Web
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            changed_paths="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")"
          else
            changed_paths="$(git show --pretty='' --name-only "${GITHUB_SHA}")"
          fi
          if ! grep -q '^\.github/release-gates/cutover-maintenance/' <<< "${changed_paths}"; then
            exit 0
          fi

          echo "Breaking direct-only cutover: waiting for API plus processing workers."
          for attempt in $(seq 1 240); do
            state="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-api.yml/runs" \
              -f head_sha="${GITHUB_SHA}" -f per_page=10 \
              --jq '[.workflow_runs[0].status // "", .workflow_runs[0].conclusion // "", .workflow_runs[0].html_url // ""] | @tsv')"
            IFS=$'\t' read -r status conclusion run_url <<< "${state}"
            if [ "${status}" = "completed" ]; then
              [ "${conclusion}" = "success" ] && exit 0
              echo "Matching API/worker deployment failed: ${run_url}"
              exit 1
            fi
            if (( attempt % 6 == 1 )); then
              echo "Waiting for matching API/worker deployment: ${run_url:-not-started}"
            fi
            sleep 10
          done
          echo "Timed out waiting for matching API/worker deployment."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace=apps/web --include-workspace-root

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
        run: npm run build

      - name: Stamp release commit
        working-directory: apps/web
        run: printf '%s\n' "${GITHUB_SHA}" > dist/release-sha.txt

      - name: Deploy to pcugame.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: pcugame/pcugame.github.io
          publish_branch: master
          publish_dir: apps/web/dist
          user_name: bipolarrr
          user_email: challengedbipolar@gmail.com
