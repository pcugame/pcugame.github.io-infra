name: PR Checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test integration runner
        run: node --test scripts/run-integration.test.mjs

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build offline production-version Quadlet generator
        run: bash server/quadlet/build-compat-generator.sh "${RUNNER_TEMP}/quadlet-5.4.2"

      - name: Test release controls and deployment fixtures
        env:
          QUADLET_GENERATOR: ${{ runner.temp }}/quadlet-5.4.2/quadlet
          QUADLET_EXPECT_VERSION: '5.4.2'
        run: npm run test:release-controls

      - name: Check migration history and review signals
        env:
          MIGRATION_POLICY_BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: node scripts/check-migration-policy.mjs "${MIGRATION_POLICY_BASE}"

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries
        run: npm run architecture

      - name: Workspace dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: PostgreSQL + Garage integration smoke
        run: npm run test:integration

      - name: File gateway TLS verification
        run: npm run test:file-gateway

      - name: Tear down integration services
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v --remove-orphans
