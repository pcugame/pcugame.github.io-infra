name: Build API Release Image

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/deploy.sh'
      - '.github/workflows/deploy-api.yml'
      - '.github/release-gates/web-before-api/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Test API
        run: npm test --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: release-image
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: ${{ vars.API_TARGET_PLATFORMS || 'linux/amd64' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api:latest
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.sha }}
          # GHA cache layers: unchanged stages (apt-get, npm ci, sharp workaround) are
          # pulled from cache; only stages touched by the diff re-run. `mode=max` caches
          # intermediate stages too so deps + builder both benefit, not just the final
          # image. Branch-scoped per GHA cache rules; 10 GB soft limit is comfortable.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable Phase 2 artifact from the merged source
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api@${{ steps.release-image.outputs.digest }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$RELEASE_IMAGE"
          test "$(docker image inspect "$RELEASE_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SOURCE_SHA"
          docker run --rm --entrypoint node "$RELEASE_IMAGE" -e '
            const fs = require("node:fs");
            const migrations = fs.readdirSync("prisma/migrations").filter(name => fs.statSync(`prisma/migrations/${name}`).isDirectory()).sort();
            if (migrations.at(-1) !== "20260909100000_project_change_requests") throw new Error("Unexpected Phase 2 artifact migration ceiling");
            if (!fs.existsSync("prisma/contract-migration-paths/20260822000001_canonical_asset_contract_age_exception/migration.sql")) throw new Error("Missing reviewed alternate contract");
            if (!migrations.includes("20260821990000_release_exception_receipts")) throw new Error("Missing exception receipt preparation migration");
            if (fs.existsSync("dist/phase1-release-manifest.js")) throw new Error("Phase 1 runtime is not a Phase 2 artifact");
            for (const worker of ["game-validation", "webgl", "video", "image", "export", "project-publication"]) {
              if (!fs.existsSync(`dist/${worker}-worker.js`)) throw new Error(`Missing worker ${worker}`);
            }
            for (const cli of ["backfill-canonical-assets", "preflight-canonical-contract", "release-migrate", "snapshot-garage-inventory", "verify-cutover-report", "correct-canonical-assets", "correct-canonical-poster"]) {
              if (!fs.existsSync(`dist-release/scripts/${cli}.js`)) throw new Error(`Missing release CLI ${cli}`);
            }
          '

      - name: Record immutable release digest
        run: |
          printf 'Use this exact production input (mutable tags are rejected):\n%s@%s\n' \
            'ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api' \
            '${{ steps.release-image.outputs.digest }}' >> "${GITHUB_STEP_SUMMARY}"
