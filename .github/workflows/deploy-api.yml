name: Build Phase 1 API Release Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Build shared contracts
        run: npm run build --workspace=@pcu/contracts

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Test Phase 1 release tree
        run: npm run test:scripts --workspace=apps/api

      - name: Test API
        run: npm exec --workspace=apps/api -- vitest run

      - name: Build API and release CLIs
        run: npm run build --workspace=apps/api

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Phase 1 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api:phase1-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed image by immutable digest
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          immutable_image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          docker pull "${immutable_image}"

          revision="$(docker image inspect "${immutable_image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "${revision}" = "${SOURCE_SHA}"

          marker="$(docker run --rm --entrypoint node "${immutable_image}" dist/phase1-release-manifest.js)"
          test "${marker}" = 'PCU_PHASE1_RUNTIME_V1'

          docker run --rm --entrypoint sh "${immutable_image}" -eu -c '
            test -f dist/server.js
            for worker in game-validation webgl video image export; do
              test -f "dist/${worker}-worker.js"
            done
            for cli in backfill-canonical-assets preflight-canonical-contract release-migrate snapshot-garage-inventory verify-cutover-report; do
              test -f "dist-release/scripts/${cli}.js"
            done
            for migration in \
              20260821400000_project_submission_draft_status \
              20260821500000_project_submission_expand \
              20260821550000_project_submission_finalizing_status \
              20260821600000_project_publication_expand \
              20260821700000_canonical_object_relocation_expand; do
              test -f "prisma/migrations/${migration}/migration.sql"
            done
            test ! -e prisma/migrations/20260822000000_canonical_asset_contract
          '

          {
            echo '### Phase 1 API release image'
            echo "- Image: \`${immutable_image}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
