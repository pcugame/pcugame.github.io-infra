name: Build API Release Image

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/deploy.sh'
      - 'server/deploy/**'
      - '.github/workflows/deploy-api.yml'
      - '.github/release-gates/web-before-api/**'
      - 'server/verify-release-source.mjs'
      - 'server/verify-github-release-boundaries.mjs'
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.build-and-push.outputs.image }}
      source_sha:
        value: ${{ jobs.build-and-push.outputs.source_sha }}

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      source_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact merged source
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node server/verify-release-source.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Verify API build
        run: npm run verify:api-release

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: release-image
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: ${{ vars.API_TARGET_PLATFORMS || 'linux/amd64' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api:latest
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.sha }}
          # GHA cache layers: unchanged stages (apt-get, npm ci, sharp workaround) are
          # pulled from cache; only stages touched by the diff re-run. `mode=max` caches
          # intermediate stages too so deps + builder both benefit, not just the final
          # image. Branch-scoped per GHA cache rules; 10 GB soft limit is comfortable.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable release artifact from the merged source
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api@${{ steps.release-image.outputs.digest }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node apps/api/scripts/verify-release-artifact.mjs

      - name: Record immutable release digest
        run: |
          printf 'Use this exact production input (mutable tags are rejected):\n%s@%s\n' \
            'ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api' \
            '${{ steps.release-image.outputs.digest }}' >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish verified release manifest
        id: manifest
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api@${{ steps.release-image.outputs.digest }}
        run: |
          node -e 'require("node:fs").writeFileSync("release-image.json", JSON.stringify({source_sha: process.env.GITHUB_SHA, image: process.env.RELEASE_IMAGE}))'
          echo "image=${RELEASE_IMAGE}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-api-release-${{ github.sha }}
          path: release-image.json
          retention-days: 30
