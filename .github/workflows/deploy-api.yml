name: Build and Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/deploy.sh'
      - 'apps/db/upload-part.nginx.conf.template'
      - 'apps/db/public-origin.nginx.conf.template'
      - '.github/workflows/deploy-api.yml'
      - '.github/release-gates/cutover-maintenance/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Test API
        run: npm test --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: ${{ vars.API_TARGET_PLATFORMS || 'linux/amd64' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api:latest
            ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api:sha-${{ github.sha }}
          # GHA cache layers: unchanged stages (apt-get, npm ci, sharp workaround) are
          # pulled from cache; only stages touched by the diff re-run. `mode=max` caches
          # intermediate stages too so deps + builder both benefit, not just the final
          # image. Branch-scoped per GHA cache rules; 10 GB soft limit is comfortable.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy deploy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: server/deploy.sh,server/garage-incomplete-upload-cleanup.sh
          target: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          strip_components: 1
          overwrite: true

      - name: Copy transport proxy templates to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: apps/db/upload-part.nginx.conf.template,apps/db/public-origin.nginx.conf.template
          target: ${{ secrets.DEPLOY_COMPOSE_PATH || '/srv/graduationproject_v2' }}
          strip_components: 2
          overwrite: true

      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,API_IMAGE
          script_stop: true
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin
            printf '%s' "${GHCR_TOKEN}" | podman login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            export DEPLOY_DIR="${DEPLOY_DIR:-/srv/graduationproject_v2}"
            chmod +x "${DEPLOY_DIR}/deploy.sh"
            chmod +x "${DEPLOY_DIR}/garage-incomplete-upload-cleanup.sh"
            # Breaking schema/contract cutover: the candidate image owns the
            # read-only audit and migration. Old writers are drained first and
            # are never automatically restarted after the DDL boundary.
            API_IMAGE="${API_IMAGE}" PULL_API_IMAGE=true "${DEPLOY_DIR}/deploy.sh" cutover
            API_IMAGE="${API_IMAGE}" PULL_API_IMAGE=false "${DEPLOY_DIR}/deploy.sh" up
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_PATH }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/pcu-graduationproject-v2-api:sha-${{ github.sha }}
