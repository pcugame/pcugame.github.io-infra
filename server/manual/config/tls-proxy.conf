# Rootful host-network proxy. Only these five names accept external traffic.
# One certificate with all five SANs, or split the servers/certificates manually.
map $host $pcu_upstream {
  default "";
  api.pcu.test http://127.0.0.1:4000;
  web.pcu.test http://127.0.0.1:8080;
  upload.pcu.test http://127.0.0.1:3901;
  assets.pcu.test http://127.0.0.1:3904;
  download.pcu.test http://127.0.0.1:3906;
}
log_format pcu_edge 'host=$host method=$request_method status=$status bytes=$bytes_sent';
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}
server {
  listen 443 ssl;
  server_name api.pcu.test web.pcu.test upload.pcu.test assets.pcu.test download.pcu.test;
  ssl_certificate /etc/pcu/tls/fullchain.pem;
  ssl_certificate_key /etc/pcu/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log /var/log/nginx/access.log pcu_edge;
  error_log /dev/null crit;
  client_max_body_size 16m;
  client_body_timeout 60s;
  location / {
    proxy_pass $pcu_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_next_upstream off;
  }
}
