[Unit]
Description=Local Qwen3-4B inference with archive resource budget

[Service]
Type=notify
NotifyAccess=main
WorkingDirectory=/opt/term-origin-llm
ExecStart=
ExecStart=/usr/bin/python3 -u /opt/term-origin-llm/server.py
RuntimeDirectory=qwen-coder
RuntimeDirectoryMode=0700
UMask=0077
Restart=always
RestartSec=3s
TimeoutStartSec=180s
KillMode=control-group

[Install]
WantedBy=multi-user.target
