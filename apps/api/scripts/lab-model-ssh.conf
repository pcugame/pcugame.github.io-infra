Host gameserver-model
    HostName host.containers.internal
    Port 5050
    User pcu-lab-forward
    IdentityFile /run/lab-ssh/identity
    IdentitiesOnly yes
    BatchMode yes
    StrictHostKeyChecking yes
    UserKnownHostsFile /run/lab-ssh/known_hosts
    GlobalKnownHostsFile /dev/null
    UpdateHostKeys no
    ExitOnForwardFailure yes
    ConnectTimeout 5
    ServerAliveInterval 15
    ServerAliveCountMax 3
